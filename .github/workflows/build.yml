# Builds the dashboard, background service and tray companion and runs the tests on every push and pull request.
name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build WindowsUtility.sln -c Release

      - name: Test
        run: dotnet test tests/WindowsUtility.Tests/WindowsUtility.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
